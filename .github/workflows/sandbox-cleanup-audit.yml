name: Sandbox cleanup audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    name: Simulate cleanup and request approval
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure for read-only inventory
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run cleanup audit simulation
        uses: azure/powershell@v2
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SANDBOX_ACS_CONNECTION_STRING: ${{ secrets.SANDBOX_ACS_CONNECTION_STRING }}
          SANDBOX_ACS_SENDER: ${{ vars.SANDBOX_ACS_SENDER }}
          SANDBOX_TEAMS_WEBHOOK_URL: ${{ secrets.SANDBOX_TEAMS_WEBHOOK_URL }}
          SANDBOX_APPROVAL_BASE_URL: ${{ vars.SANDBOX_APPROVAL_BASE_URL }}
          SANDBOX_SIGNING_SECRET: ${{ secrets.SANDBOX_SIGNING_SECRET }}
          SANDBOX_SMTP_SERVER: ${{ vars.SANDBOX_SMTP_SERVER }}
          SANDBOX_SMTP_USERNAME: ${{ secrets.SANDBOX_SMTP_USERNAME }}
          SANDBOX_SMTP_PASSWORD: ${{ secrets.SANDBOX_SMTP_PASSWORD }}
        with:
          azPSVersion: latest
          inlineScript: |
            Import-Module ./src/AzureSandboxLifecycle.psd1 -Force

            $AuditParameters = @{
              SubscriptionId   = @($env:AZURE_SUBSCRIPTION_ID)
              GracePeriodHours = 24
              ApproverEmail    = 'approver@example.com'
              AuditPath        = './out/audit'
            }

            if (-not [string]::IsNullOrWhiteSpace($env:SANDBOX_ACS_CONNECTION_STRING)) {
              $AuditParameters.AcsConnectionString = $env:SANDBOX_ACS_CONNECTION_STRING
              if (-not [string]::IsNullOrWhiteSpace($env:SANDBOX_ACS_SENDER)) {
                $AuditParameters.AcsSenderAddress = $env:SANDBOX_ACS_SENDER
              }
            }
            elseif (-not [string]::IsNullOrWhiteSpace($env:SANDBOX_SMTP_SERVER)) {
              $AuditParameters.SmtpServer = $env:SANDBOX_SMTP_SERVER
              if (-not [string]::IsNullOrWhiteSpace($env:SANDBOX_SMTP_USERNAME)) {
                $SecurePassword = ConvertTo-SecureString $env:SANDBOX_SMTP_PASSWORD -AsPlainText -Force
                $AuditParameters.SmtpCredential = [pscredential]::new($env:SANDBOX_SMTP_USERNAME, $SecurePassword)
              }
            }

            if (-not [string]::IsNullOrWhiteSpace($env:SANDBOX_TEAMS_WEBHOOK_URL)) {
              $AuditParameters.TeamsWebhookUrl = $env:SANDBOX_TEAMS_WEBHOOK_URL
            }

            if (-not [string]::IsNullOrWhiteSpace($env:SANDBOX_APPROVAL_BASE_URL) -and -not [string]::IsNullOrWhiteSpace($env:SANDBOX_SIGNING_SECRET)) {
              $AuditParameters.ApprovalBaseUrl = $env:SANDBOX_APPROVAL_BASE_URL
              $AuditParameters.SigningSecret = $env:SANDBOX_SIGNING_SECRET
            }

            Invoke-AzSandboxCleanupAudit @AuditParameters | ConvertTo-Json -Depth 6

      - name: Publish audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-cleanup-audit
          path: out/audit/**
          if-no-files-found: error
          retention-days: 30

  delete:
    name: Delete approved sandboxes with managed identity
    needs: audit
    runs-on: [self-hosted, azure]
    environment: sandbox-deletion-approval
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Delete expired sandboxes with the user-assigned managed identity
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_DELETE_IDENTITY_CLIENT_ID: ${{ vars.AZURE_DELETE_IDENTITY_CLIENT_ID }}
        run: |
          Import-Module ./src/AzureSandboxLifecycle.psd1 -Force

          Remove-AzExpiredSandbox `
            -SubscriptionId @($env:AZURE_SUBSCRIPTION_ID) `
            -GracePeriodHours 24 `
            -ManagedIdentityClientId $env:AZURE_DELETE_IDENTITY_CLIENT_ID `
            -Confirm:$false
