name: Sandbox cleanup

on:
  workflow_dispatch:
    inputs:
      what_if:
        description: Report expired sandboxes without deleting them
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: Remove expired sandboxes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Clean up and export inventory
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            Import-Module ./src/AzureSandboxLifecycle.psd1 -Force

            $SubscriptionId = '${{ vars.AZURE_SUBSCRIPTION_ID }}'
            $IsWhatIf = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.what_if }}' -eq 'true'
            $CleanupParameters = @{
              SubscriptionId = @($SubscriptionId)
              GracePeriodHours = 24
              Confirm = $false
            }

            if ($IsWhatIf) {
              Remove-AzExpiredSandbox @CleanupParameters -WhatIf
            }
            else {
              Remove-AzExpiredSandbox @CleanupParameters
            }

            Export-AzSandboxDashboard -SubscriptionId @($SubscriptionId) -Path ./out/sandbox-inventory.html

      - name: Publish inventory dashboard
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-inventory
          path: out/sandbox-inventory.html
          if-no-files-found: error
          retention-days: 14
